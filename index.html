<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover は使わない（iPhone横向きでタッチ位置が余白の分だけずれる不具合を避けるため） -->
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>スサノオ 操作</title>
<style>
  :root{
    --bg:#111418; --panel:#1b2027; --line:#2c333d; --text:#e8ecf1; --muted:#8a94a3;
    --accent:#3fa7ff; --ok:#3ccf7a; --ng:#ff5d5d; --on:#f5a524; --warn:#f5c524;
    --pad:min(200px,52vw,56vh);
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;background:var(--bg);color:var(--text);overflow:hidden;overscroll-behavior:none;touch-action:none;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
  /* ページ全体を画面に固定（スクロール位置がずれてタッチ位置がずれるのを防ぐ） */
  body{position:fixed;inset:0;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--line)}
  header h1{font-size:14px;font-weight:600;margin:0;flex:1}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--ng)}
  .dot.on{background:var(--ok)}
  #status{font-size:12px;color:var(--muted)}
  #connectBtn{border:0;border-radius:8px;padding:7px 14px;font-size:14px;font-weight:600;background:var(--accent);color:#fff}
  #connectBtn.disconnect{background:#3a424e}
  #warn{display:none;margin:8px 12px 0;padding:8px 10px;border-radius:8px;background:#3a2a12;color:#ffcf85;font-size:13px;line-height:1.5}

  main{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"m p";
    align-items:center;gap:16px;padding:10px 16px}
  main.stopped{grid-template-columns:1fr;grid-template-areas:"p"}
  main.stopped #modeSw{display:none}
  @media (orientation:portrait){
    main{grid-template-columns:1fr;grid-template-areas:"m" "p";grid-template-rows:auto 1fr;justify-items:center}
    main.stopped{grid-template-areas:"p";grid-template-rows:1fr}
  }
  #modeSw{grid-area:m}
  .panel{grid-area:p;display:none;width:100%;height:100%;align-items:center;justify-content:space-evenly;gap:16px}
  .panel.show{display:flex}
  @media (orientation:portrait){ .panel{flex-direction:column} }
  .col{display:flex;flex-direction:column;align-items:center;gap:12px}
  .lbl{font-size:11px;color:var(--muted);text-align:center;letter-spacing:.05em}
  .val{font-size:12px;color:var(--muted);text-align:center;margin-top:4px;font-variant-numeric:tabular-nums;font-family:ui-monospace,Menlo,monospace}
  .msg{font-size:16px;color:var(--muted);text-align:center;line-height:1.7}
  .locked{opacity:.3}

  /* モード切替（三段スイッチ2） */
  .sw{display:flex;flex-direction:column;align-items:center;gap:4px}
  #modeLbl{font-size:12px;color:var(--muted)}
  #modeLbl b{color:var(--text)}
  .seg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
  .seg button{width:104px;height:48px;border:0;background:transparent;color:var(--muted);font-size:15px;font-weight:700;touch-action:none}
  .seg button+button{border-top:1px solid var(--line)}
  .seg button.on{background:var(--on);color:#1a1200}
  .seg button.dis{opacity:.25}

  /* 押しボタン（モーメンタリ） */
  .btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .pb{height:56px;min-width:96px;padding:0 14px;border:0;border-radius:12px;background:#2a313b;color:var(--text);
    font-size:16px;font-weight:700;touch-action:none}
  .pb.ok{background:var(--accent);color:#fff}
  .pb.start{background:var(--ok);color:#06210f}
  .pb.end{background:#5a2e33;color:#ffd0d0}
  .pb.big{height:64px;min-width:120px;font-size:18px}
  .pb.recover{height:72px;min-width:200px;font-size:22px;background:var(--accent);color:#fff}
  .pb.pressed{filter:brightness(1.4)}
  .pb.dis{opacity:.25}
  .pb small{display:block;font-size:10px;font-weight:600;opacity:.85}

  /* 長押しボタン：押している間、下のバーが1秒で伸び、伸びきったら確定 */
  .hold{position:relative;overflow:hidden;line-height:1.15}
  .hold .bar{position:absolute;left:0;bottom:0;height:5px;width:0;background:rgba(255,255,255,.9)}
  .hold.holding .bar{width:100%;transition:width 1s linear}

  /* オルタネイトボタン（押すたびにON/OFF） */
  .tgs{display:grid;grid-template-columns:repeat(2,100px);gap:10px}
  .tg{height:52px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);
    font-size:15px;font-weight:700;touch-action:none;position:relative}
  .tg::after{content:"OFF";position:absolute;right:7px;top:4px;font-size:9px;font-weight:600;opacity:.7}
  .tg.on{background:var(--on);border-color:var(--on);color:#1a1200}
  .tg.on::after{content:"ON"}
  .tg.pause.on{background:var(--warn);border-color:var(--warn);color:#1a1600}
  .tg.dis{opacity:.25}
  .tg.hidden{visibility:hidden}
  .tg.big{height:64px;min-width:120px;font-size:18px}

  /* 記録開始 ⇔ 記録終了 */
  .recbtn{height:52px;border:2px solid var(--ng);border-radius:12px;background:var(--panel);color:var(--ng);
    font-size:15px;font-weight:700;touch-action:none}
  .recbtn.recording{background:var(--ng);color:#fff}
  .recbtn small{display:block;font-size:10px;font-weight:600;opacity:.85}

  /* 状態表示 */
  .badge{min-width:170px;padding:7px 14px;border-radius:999px;text-align:center;font-size:14px;font-weight:700;
    background:var(--panel);color:var(--muted);border:1px solid var(--line)}
  .badge.rec{background:rgba(255,93,93,.15);color:var(--ng);border-color:var(--ng)}
  .badge.rec::before{content:"●";margin-right:6px;animation:blink 1s steps(2) infinite}
  .badge.pause{background:rgba(245,197,36,.15);color:var(--warn);border-color:var(--warn)}
  .badge.pause::before{content:"❚❚";margin-right:6px;letter-spacing:-2px}
  .badge.run{background:rgba(60,207,122,.15);color:var(--ok);border-color:var(--ok)}
  .badge.run::before{content:"▶";margin-right:6px}
  @keyframes blink{50%{opacity:0}}

  /* 停止画面 */
  .stopTitle{font-size:34px;font-weight:800;letter-spacing:.08em}
  #pAbn .stopTitle{color:var(--warn)}
  #pEstop .stopTitle{color:var(--ng);animation:blink 1.2s steps(2) infinite}
  #pEstop{background:repeating-linear-gradient(45deg,rgba(255,93,93,.07) 0 18px,transparent 18px 36px);border-radius:16px}
  .reason{font-size:15px;color:var(--text);text-align:center}

  /* ルート表示 */
  #routeNum{font-size:56px;font-weight:800;line-height:1;text-align:center;font-variant-numeric:tabular-nums}
  #routeNum small{font-size:16px;font-weight:600;color:var(--muted);margin-right:8px}
  #routeNote{min-height:16px;font-size:13px;color:var(--muted);font-weight:600}
  #routeNote.decided{color:var(--ok);font-weight:700}

  /* スライダー */
  #slider{width:min(230px,80vw)}
  .track{position:relative;height:44px;touch-action:none}
  .rail{position:absolute;left:16px;right:16px;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:var(--line)}
  .fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:4px;background:var(--accent)}
  .thumb{position:absolute;top:50%;left:0;width:30px;height:30px;margin-top:-15px;border-radius:50%;
    background:#e8ecf1;box-shadow:0 2px 8px rgba(0,0,0,.5);transform:translateX(-50%);pointer-events:none}
  .ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);padding:0 4px}

  /* 移動：8方向ボタン（押している間だけ動く。指を滑らせると向きが変わる） */
  .dpad{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:6px;
    width:var(--pad);height:var(--pad);touch-action:none;margin-top:4px}
  .cell{display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--panel);
    border:2px solid var(--line);font-size:28px;font-weight:700;color:var(--text);pointer-events:none}
  .cell.diag{color:#b9c3cf}
  .cell.center{background:transparent;border-color:transparent;color:var(--muted);font-size:11px;font-weight:600}
  .cell.on{background:var(--accent);border-color:var(--accent);color:#fff}

  footer{padding:5px 12px 8px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);
    display:flex;gap:14px;align-items:center;white-space:nowrap;overflow:hidden}
  footer b{color:var(--text);font-weight:600}
  footer b.ng{color:var(--ng)}

  /* タッチ位置の確認用（URLの最後に ?debug=1 を付けたときだけ表示） */
  #tapDot{position:fixed;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:rgba(255,40,40,.75);
    border:2px solid #fff;pointer-events:none;z-index:99;display:none}
  #tapInfo{position:fixed;left:8px;bottom:36px;font-size:11px;background:rgba(0,0,0,.75);color:#fff;padding:4px 8px;
    border-radius:6px;pointer-events:none;z-index:99;display:none}
</style>
</head>
<body>
<header>
  <div class="dot" id="dot"></div>
  <h1>スサノオ 操作</h1>
  <div id="status">未接続</div>
  <button id="connectBtn">接続</button>
</header>
<div id="warn">このブラウザはWeb Bluetoothに対応していません。iPhoneでは <b>Bluefy</b> アプリでこのページを開いてください。</div>

<main id="main">
  <!-- 三段スイッチ2（モード）：停止画面以外では常に表示 -->
  <section id="modeSw" class="sw">
    <div id="modeLbl">モード <b id="modeName">―</b></div>
    <div class="seg">
      <button data-v="2">自動</button>
      <button data-v="0">スタンバイ</button>
      <button data-v="1">手動</button>
    </div>
  </section>

  <!-- モード未選択（―） -->
  <section id="pNone" class="panel show">
    <div class="msg" id="noneMsg">「接続」を押して本機とつないでください</div>
  </section>

  <!-- スタンバイ：ルート選択・決定 -->
  <section id="pStandby" class="panel">
    <div class="col">
      <div class="lbl">ルート選択（1〜30）</div>
      <div id="routeNum"><small>ルート</small><span id="routeVal">1</span></div>
      <div class="btnrow">
        <button class="pb" data-ev="down">ルート −1</button>
        <button class="pb ok" data-ev="decide">決定</button>
        <button class="pb" data-ev="up">ルート +1</button>
      </div>
      <div id="routeNote"></div>
    </div>
  </section>

  <!-- 手動 -->
  <section id="pManual" class="panel">
    <div class="col">
      <div class="tgs">
        <button class="tg" data-key="top">上面</button>
        <button class="tg" data-key="slope">法面</button>
        <button class="recbtn hold" id="recBtn"><span id="recLabel">● 記録開始</span><small id="recSub"></small><span class="bar"></span></button>
        <button class="tg pause" data-key="pause" id="pauseManual">一時停止</button>
      </div>
      <div id="recBadge" class="badge">記録していません</div>
      <div id="slider">
        <div class="lbl">法面トリマー長さ <span id="slVal">0</span></div>
        <div class="track" id="track"><div class="rail" id="rail"><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div></div>
        <div class="ends"><span>0 収納</span><span>展開 100</span></div>
      </div>
    </div>
    <div id="move">
      <div class="lbl">移動</div>
      <div class="dpad" id="dpad">
        <div class="cell diag" data-f="1" data-t="-1">↖</div>
        <div class="cell" data-f="1" data-t="0">↑</div>
        <div class="cell diag" data-f="1" data-t="1">↗</div>
        <div class="cell" data-f="0" data-t="-1">←</div>
        <div class="cell center">停止</div>
        <div class="cell" data-f="0" data-t="1">→</div>
        <div class="cell diag" data-f="-1" data-t="-1">↙</div>
        <div class="cell" data-f="-1" data-t="0">↓</div>
        <div class="cell diag" data-f="-1" data-t="1">↘</div>
      </div>
      <div class="val" id="moveVal">前後 0　左右 0</div>
    </div>
  </section>

  <!-- 自動 -->
  <section id="pAuto" class="panel">
    <div class="col">
      <div id="autoBadge" class="badge">開始待ち</div>
      <div class="btnrow">
        <button class="pb start big" data-ev="start" id="btnStart">開始</button>
        <button class="tg pause big" data-key="pause" id="pauseAuto">一時停止</button>
        <button class="pb end big hold" id="btnEnd">終了<small>長押し</small><span class="bar"></span></button>
      </div>
    </div>
  </section>

  <!-- 異常停止：復帰ボタンのみ -->
  <section id="pAbn" class="panel">
    <div class="col">
      <div class="stopTitle">異常停止</div>
      <div class="reason" id="abnReason">—</div>
      <button class="pb recover" data-ev="recover">復帰</button>
      <div class="lbl" id="recoverNote"></div>
    </div>
  </section>

  <!-- 非常停止：操作不可 -->
  <section id="pEstop" class="panel">
    <div class="col">
      <div class="stopTitle">非常停止</div>
      <div class="msg">本機の非常停止ボタンが押されています。<br>安全を確認してから、本機のボタンを解除してください。</div>
    </div>
  </section>
</main>

<footer>
  <span>本機 <b id="fFlow">—</b></span>
  <span>RTK <b id="fRtk">—</b></span>
  <span>電池 <b id="fBat">—</b></span>
  <span>遅延 <b id="fRtt">—</b></span>
  <span>異常 <b id="fErr">—</b></span>
</footer>

<script>
// ===== スサノオ操作アプリ BLE 通信仕様 v2 =====
const SVC     = '84dbef29-b58a-4048-a30e-e70379b4d89a';
const CTRL    = '285a8eee-a316-408b-873e-6404cdf3c153'; // 操作データ iPhone → 本機（17バイト）
const STATUS  = '611bdaee-2f87-400b-9775-ea8bdb8802ac'; // 状態データ 本機 → iPhone（13バイト）
const PROTOCOL_VERSION = 2;
const SEND_INTERVAL_MS = 50;
const HOLD_MS = 1000;            // 長押しで確定するまでの時間
const ROUTE_MIN = 1, ROUTE_MAX = 30;
const DEBUG = new URLSearchParams(location.search).has('debug');

const FLOW = ['起動時チェック','スタンバイ','手動運転前チェック','操作待機','手動操作','記録中','記録一時停止',
              '運転待機','運転前チェック','自動運転中','自動運転一時停止','非常停止','異常停止','異常停止（保護）','作業完了'];
const ERR  = ['なし','非常停止ボタン','GPSロスト','通信途絶','転倒・持ち上げ','衝突検知','人検知','電源電圧の異常',
              '走行異常','記録の書き込み失敗','記録を読めない','開始地点から離れている','初期位置にない'];
const RTK  = ['なし','単独','Float','Fix'];
const MODE_NAME = ['スタンバイ','手動','自動'];
const FLOW_ESTOP = 11, FLOW_ABN = 12, FLOW_PROTECT = 13;

const $ = id => document.getElementById(id);

// 画面の状態（ここが唯一の正。render() で画面に反映する）
const s = {
  mode: null,         // null:―（未選択） 0:スタンバイ 1:手動 2:自動
  fwd: 0, turn: 0,    // 移動 前後（前進＋）・左右（右＋）。8方向ボタンなので −100 / 0 / 100
  top: 0, slope: 0,   // トリマー（それぞれ単独でON/OFF可）
  rec: 0, pause: 0,   // 記録・一時停止
  arm: 0,             // 法面トリマー長さの目標 0〜100
  route: 1,           // 表示中のルート番号 1〜30
  decided: false,     // ルート決定済み（ルート±1を押すと取り消し。モード変更・停止・切断では取り消さない）
  autoStarted: false,
  stop: null,         // 本機の停止状態 null / 'abn'（異常停止） / 'estop'（非常停止）
  stopErr: 0
};
// 0:全OFF 1:上面のみ 2:上面＋法面 3:法面のみ
const trimmerCode = () => s.top ? (s.slope ? 2 : 1) : (s.slope ? 3 : 0);
// 一時停止中か（手動で記録中、または自動で運転中のときだけ一時停止がある）
const isPaused = () => !!s.pause && ((s.mode === 1 && !!s.rec) || (s.mode === 2 && s.autoStarted));

// 押した回数（UInt8、255の次は0）
const cnt = {decide:0, up:0, down:0, start:0, end:0, recover:0};

let device = null, ctrlChar = null, connected = false, busy = false, timer = null, seq = 0, stopReq = false;
const sentAt = new Float64Array(65536);

// 押した操作を本機が受け取るまでは、本機から届く表示で画面を上書きしない（ちらつき防止）。
// 状態データの「最後に受け取った通し番号」が、押した直後に送るフレームの番号に届いたら受け取り済み。
const pending = {route: null, auto: null};
const nextSeq = () => (seq + 1) & 0xFFFF;
const reached = (got, want) => ((got - want) & 0xFFFF) < 0x8000;   // got ≥ want（65535→0 の折り返し込み）

if (!navigator.bluetooth) $('warn').style.display = 'block';

// そのモードに今切り替えられるか
function canSelectMode(v){
  if (!connected || s.stop || isPaused()) return false;   // 未接続・停止中・一時停止中は切り替え不可
  if (v === 0) return true;                               // スタンバイはいつでも
  return s.mode !== null && s.decided;                    // 手動・自動はスタンバイでルートを決定してから
}

// ---------------- 画面の反映 ----------------
function render(){
  const view = s.stop ?? (s.mode === null ? 'none' : ['standby','manual','auto'][s.mode]);
  const paused = isPaused();
  $('main').classList.toggle('stopped', !!s.stop);
  $('pNone').classList.toggle('show', view === 'none');
  $('pStandby').classList.toggle('show', view === 'standby');
  $('pManual').classList.toggle('show', view === 'manual');
  $('pAuto').classList.toggle('show', view === 'auto');
  $('pAbn').classList.toggle('show', view === 'abn');
  $('pEstop').classList.toggle('show', view === 'estop');

  // モード切替
  $('modeName').textContent = s.mode === null ? '―' : MODE_NAME[s.mode];
  document.querySelectorAll('#modeSw button').forEach(b => {
    const v = Number(b.dataset.v);
    b.classList.toggle('on', v === s.mode);
    b.classList.toggle('dis', !canSelectMode(v));
  });
  $('noneMsg').textContent = connected ? '「スタンバイ」を選んでください' : '「接続」を押して本機とつないでください';

  // ルート
  $('routeVal').textContent = s.route;
  const rn = $('routeNote');
  rn.classList.toggle('decided', s.decided);
  rn.textContent = s.decided ? `ルート ${s.route} に決定済み` : '「決定」を押すと手動・自動を選べます';

  // 手動（一時停止中は上面・法面・移動・スライダーを押せない。記録終了と一時停止の解除は押せる）
  document.querySelectorAll('.tg').forEach(b => b.classList.toggle('on', !!s[b.dataset.key]));
  document.querySelectorAll('.tg[data-key=top], .tg[data-key=slope]').forEach(b => b.classList.toggle('dis', paused));
  $('pauseManual').classList.toggle('hidden', !s.rec);   // 一時停止は記録中のみ出現
  $('move').classList.toggle('locked', paused);
  $('slider').classList.toggle('locked', paused);
  $('recBtn').classList.toggle('recording', !!s.rec);
  $('recLabel').textContent = s.rec ? '記録終了' : '● 記録開始';
  $('recSub').textContent = s.rec ? '長押し' : '';

  const rb = $('recBadge');
  rb.className = 'badge' + (s.rec ? (s.pause ? ' pause' : ' rec') : '');
  rb.textContent = s.rec ? (s.pause ? '記録一時停止中' : '記録中') : '記録していません';

  // 自動：開始は開始前だけ、一時停止と終了は開始後だけ（終了は一時停止中も押せる）
  const ab = $('autoBadge');
  ab.className = 'badge' + (s.autoStarted ? (s.pause ? ' pause' : ' run') : '');
  ab.textContent = s.autoStarted ? (s.pause ? '一時停止中' : '自動運転中') : '開始待ち';
  $('btnStart').classList.toggle('dis', s.autoStarted);
  $('pauseAuto').classList.toggle('dis', !s.autoStarted);
  $('btnEnd').classList.toggle('dis', !s.autoStarted);

  // 異常停止の理由
  $('abnReason').textContent = s.stopErr ? `原因：${ERR[s.stopErr] ?? 'コード' + s.stopErr}` : '安全を確認して「復帰」を押してください';
}

// 刃・記録・一時停止・移動・自動運転を初期状態に戻す
function resetControls(){
  s.top = s.slope = s.rec = s.pause = 0;
  s.autoStarted = false;
  resetMove();
  cancelHolds();
}

function setMode(m){
  if (m === s.mode || !canSelectMode(m)) return;
  s.mode = m;
  resetControls();
  render();
}

// ---------------- BLE ----------------
function setStatus(on, text){
  $('dot').classList.toggle('on', on);
  $('status').textContent = text;
  const btn = $('connectBtn');
  btn.textContent = on ? '切断' : '接続';
  btn.classList.toggle('disconnect', on);
}

function buildFrame(){
  const buf = new Uint8Array(17), dv = new DataView(buf.buffer);
  seq = (seq + 1) & 0xFFFF;
  dv.setUint16(0, seq, true);
  buf[2] = PROTOCOL_VERSION;
  let flags = 0;
  if (!document.hidden && !stopReq) flags |= 0x01;   // bit0 操作有効
  if (stopReq) flags |= 0x02;                        // bit1 停止要求
  buf[3] = flags;
  const driving = s.mode === 1 && !s.stop && !isPaused();   // 一時停止中は移動を中立で送る
  dv.setInt8(4, driving ? s.fwd : 0);
  dv.setInt8(5, driving ? s.turn : 0);
  buf[6] = s.mode ?? 0;          // ―はスタンバイとして送る
  buf[7] = trimmerCode();
  buf[8] = s.rec;
  buf[9] = s.pause;
  buf[10] = s.arm;
  buf[11] = cnt.decide;
  buf[12] = cnt.up;
  buf[13] = cnt.down;
  buf[14] = cnt.start;
  buf[15] = cnt.end;
  buf[16] = cnt.recover;
  sentAt[seq] = performance.now();
  return buf;
}

async function sendFrame(){
  if (busy || !ctrlChar) return;
  busy = true;
  try {
    const f = buildFrame();
    if (ctrlChar.writeValueWithoutResponse) await ctrlChar.writeValueWithoutResponse(f);
    else await ctrlChar.writeValue(f);
  } catch(e) {
    console.warn('送信失敗', e);
  } finally {
    busy = false;
  }
}

function onStatus(dv){
  if (dv.byteLength < 13) return;
  const st = {
    mode: dv.getUint8(1), flow: dv.getUint8(2), route: dv.getUint8(3), err: dv.getUint8(4),
    rtk: dv.getUint8(5), volt: dv.getUint16(6, true), seq: dv.getUint16(9, true), age: dv.getUint16(11, true)
  };
  $('fFlow').textContent = FLOW[st.flow] ?? `状態${st.flow}`;
  $('fRtk').textContent = RTK[st.rtk] ?? '—';
  $('fBat').textContent = st.volt ? (st.volt/100).toFixed(2) + 'V' : '—';
  const e = $('fErr');
  e.textContent = ERR[st.err] ?? `コード${st.err}`;
  e.classList.toggle('ng', st.err !== 0);
  const t0 = sentAt[st.seq];
  if (t0) $('fRtt').textContent = Math.max(0, Math.round(performance.now() - t0 - st.age)) + 'ms';

  // 停止状態（本機の判断に従う）
  const stop = st.flow === FLOW_ESTOP ? 'estop' : (st.flow === FLOW_ABN || st.flow === FLOW_PROTECT ? 'abn' : null);
  if (stop !== s.stop || (stop && st.err !== s.stopErr)){
    if (stop && !s.stop){
      // 停止に入ったら操作をすべて初期状態にし、モードも―に戻す（ルートの決定はそのまま）
      resetControls();
      s.mode = null;
      $('recoverNote').textContent = '';
    }
    s.stop = stop;
    s.stopErr = st.err;
    render();
  }

  // ルート番号：押したルート±1を本機が受け取ってから、本機の値に合わせる。
  // 受け取ったあとも本機の番号が違っていたら（本機の再起動など）、決定は取り消す
  if (pending.route !== null && reached(st.seq, pending.route)) pending.route = null;
  if (pending.route === null && st.route !== s.route){
    s.route = st.route;
    s.decided = false;
    render();
  }

  // 自動運転の開始・終了：押した操作を本機が受け取ってから、本機の状態に合わせる
  if (pending.auto !== null && reached(st.seq, pending.auto)) pending.auto = null;
  if (s.mode === 2 && !s.stop && pending.auto === null){
    const started = st.flow === 9 || st.flow === 10;
    if (started !== s.autoStarted){ s.autoStarted = started; if (!started) s.pause = 0; render(); }
  }
}

async function connect(){
  try {
    setStatus(false, '検索中…');
    device = await navigator.bluetooth.requestDevice({filters: [{services:[SVC]}], optionalServices: [SVC]});
    device.addEventListener('gattserverdisconnected', onDisconnected);
    setStatus(false, '接続中…');
    const server = await device.gatt.connect();
    const service = await server.getPrimaryService(SVC);
    ctrlChar = await service.getCharacteristic(CTRL);
    const stChar = await service.getCharacteristic(STATUS);
    await stChar.startNotifications();
    stChar.addEventListener('characteristicvaluechanged', e => onStatus(e.target.value));
    stopReq = false;
    connected = true;
    setStatus(true, device.name || '接続済み');
    timer = setInterval(sendFrame, SEND_INTERVAL_MS);
    render();
  } catch(e) {
    console.warn(e);
    setStatus(false, e.name === 'NotFoundError' ? '未接続' : '接続失敗');
    ctrlChar = null;
  }
}
function onDisconnected(){
  clearInterval(timer); timer = null;
  ctrlChar = null; busy = false; connected = false;
  pending.route = pending.auto = null;
  resetControls();
  s.mode = null; s.stop = null; s.stopErr = 0;   // ルートの決定はそのまま
  ['fFlow','fRtk','fBat','fRtt','fErr'].forEach(id => $(id).textContent = '—');
  setStatus(false, '切断されました');
  render();
}
$('connectBtn').addEventListener('click', () => {
  if (device && device.gatt.connected) device.gatt.disconnect();
  else connect();
});

// 画面が裏に回ったら停止要求を送る
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ stopReq = true; sendFrame(); }
  else { stopReq = false; }
});

// 画面の回転などでスクロール位置がずれないように、常に左上に戻す
const pinScroll = () => window.scrollTo(0, 0);
window.addEventListener('resize', pinScroll);
window.addEventListener('orientationchange', () => setTimeout(pinScroll, 300));

// ---------------- 操作部 ----------------
document.querySelectorAll('#modeSw button').forEach(b => b.addEventListener('pointerdown', e => {
  e.preventDefault(); setMode(Number(b.dataset.v));
}));

// オルタネイトボタン（上面・法面・一時停止）
document.querySelectorAll('.tg').forEach(b => b.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (s.stop || b.classList.contains('dis') || b.classList.contains('hidden')) return;
  const k = b.dataset.key;
  s[k] = s[k] ? 0 : 1;
  if (k === 'pause' && s.pause) resetMove();       // 一時停止したら移動を止める
  render();
}));

// 押しボタン（ルート−1 / 決定 / ルート+1 / 開始 / 復帰）
document.querySelectorAll('.pb:not(.hold)').forEach(b => {
  b.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (b.classList.contains('dis')) return;
    const ev = b.dataset.ev;
    if (s.stop && !(s.stop === 'abn' && ev === 'recover')) return;   // 停止中は復帰以外押せない
    b.classList.add('pressed');
    switch (ev){
      case 'up':     // 30の次は1
        cnt.up = (cnt.up + 1) & 0xFF;
        s.route = s.route >= ROUTE_MAX ? ROUTE_MIN : s.route + 1;
        s.decided = false; pending.route = nextSeq(); break;
      case 'down':   // 1の前は30
        cnt.down = (cnt.down + 1) & 0xFF;
        s.route = s.route <= ROUTE_MIN ? ROUTE_MAX : s.route - 1;
        s.decided = false; pending.route = nextSeq(); break;
      case 'decide':
        cnt.decide = (cnt.decide + 1) & 0xFF;
        s.decided = true; break;
      case 'start':
        cnt.start = (cnt.start + 1) & 0xFF;
        s.pause = 0; s.autoStarted = true; pending.auto = nextSeq(); break;
      case 'recover':
        cnt.recover = (cnt.recover + 1) & 0xFF;
        $('recoverNote').textContent = '復帰を送信しました…'; break;
    }
    render();
  });
  const up = () => b.classList.remove('pressed');
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('pointerleave', up);
});

// 長押しボタン：押している間バーが伸び、HOLD_MS 押し続けたら確定。途中で離したら取り消し
const holdCancels = [];
function cancelHolds(){ holdCancels.forEach(f => f()); }
function makeHold(btn, {tap, canHold, done}){
  let t = null, pid = null;
  const cancel = () => { clearTimeout(t); t = null; pid = null; btn.classList.remove('holding'); };
  holdCancels.push(cancel);
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (s.stop || btn.classList.contains('dis') || pid !== null) return;
    if (tap && tap()) return;                 // 長押し不要な操作（記録開始）はその場で完了
    if (!canHold()) return;
    pid = e.pointerId;
    btn.classList.add('holding');
    t = setTimeout(() => { cancel(); if (!s.stop && canHold()) done(); }, HOLD_MS);
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(type =>
    btn.addEventListener(type, e => { if (e.pointerId === pid) cancel(); }));
}

// 記録開始（1回押す）⇔ 記録終了（長押し。一時停止中も可）
makeHold($('recBtn'), {
  tap: () => {
    if (s.mode !== 1 || s.rec) return false;
    s.rec = 1; render(); return true;
  },
  canHold: () => s.mode === 1 && !!s.rec,
  done: () => { s.rec = 0; s.pause = 0; render(); }
});

// 自動の終了（長押し。一時停止中も可）
makeHold($('btnEnd'), {
  canHold: () => s.mode === 2 && s.autoStarted,
  done: () => {
    cnt.end = (cnt.end + 1) & 0xFF;
    s.pause = 0; s.autoStarted = false; pending.auto = nextSeq();
    render();
  }
});

// 移動：8方向ボタン（押している間だけ動く。指を滑らせると向きが変わる。離すと止まる）
//   ↑↓ 前後100、←→ その場回転（左右100）、斜め 前後100＋左右100
let resetMove = () => {};
(() => {
  const pad = $('dpad'), out = $('moveVal');
  const cells = [...pad.querySelectorAll('.cell')];
  let pid = null;
  const set = (fwd, turn) => {
    s.fwd = fwd; s.turn = turn;
    out.textContent = `前後 ${fwd}　左右 ${turn}`;
    cells.forEach(c => c.classList.toggle('on', !c.classList.contains('center') &&
      Number(c.dataset.f) * 100 === fwd && Number(c.dataset.t) * 100 === turn));
  };
  const move = e => {
    if (s.stop || isPaused()){ resetMove(); return; }
    const r = pad.getBoundingClientRect();
    const col = Math.max(0, Math.min(2, Math.floor((e.clientX - r.left) / r.width * 3)));
    const row = Math.max(0, Math.min(2, Math.floor((e.clientY - r.top) / r.height * 3)));
    set((1 - row) * 100 || 0, (col - 1) * 100 || 0);
  };
  resetMove = () => { pid = null; set(0, 0); };
  pad.addEventListener('pointerdown', e => {
    if (pid !== null || s.stop || isPaused()) return;    // 2本目の指は無視
    pid = e.pointerId; pad.setPointerCapture(pid); move(e);
  });
  pad.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
  pad.addEventListener('pointerup', e => { if (e.pointerId === pid) resetMove(); });
  pad.addEventListener('pointercancel', e => { if (e.pointerId === pid) resetMove(); });
})();

// スライダー（0=収納 〜 100=展開、指を離しても値は保持。一時停止中は動かせない）
(() => {
  const track = $('track'), rail = $('rail'), fill = $('fill'), thumb = $('thumb');
  let pid = null;
  const show = v => { fill.style.width = v + '%'; thumb.style.left = v + '%'; $('slVal').textContent = v; };
  const move = e => {
    if (s.stop || isPaused()){ pid = null; return; }
    const r = rail.getBoundingClientRect();
    s.arm = Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 100);
    show(s.arm);
  };
  track.addEventListener('pointerdown', e => {
    if (s.stop || isPaused()) return;
    pid = e.pointerId; track.setPointerCapture(pid); move(e);
  });
  track.addEventListener('pointermove', e => { if (e.pointerId === pid) move(e); });
  const end = e => { if (e.pointerId === pid) pid = null; };
  track.addEventListener('pointerup', end);
  track.addEventListener('pointercancel', end);
  show(s.arm);
})();

// タッチ位置の確認（URLの最後に ?debug=1 を付けて開いたときだけ）
if (DEBUG){
  const dot = document.createElement('div'); dot.id = 'tapDot'; document.body.appendChild(dot);
  const info = document.createElement('div'); info.id = 'tapInfo'; document.body.appendChild(info);
  document.addEventListener('pointerdown', e => {
    dot.style.display = info.style.display = 'block';
    dot.style.left = e.clientX + 'px'; dot.style.top = e.clientY + 'px';
    const el = document.elementFromPoint(e.clientX, e.clientY);
    const btn = el && el.closest('button');
    info.textContent = `x=${Math.round(e.clientX)} y=${Math.round(e.clientY)} → ${btn ? btn.textContent.trim() : (el ? el.id || el.tagName : 'なし')}（画面幅 ${innerWidth}）`;
  }, {capture: true});
}

render();

// iOSのスクロール・ダブルタップズーム・長押しメニューを抑止
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
</script>
</body>
</html>
